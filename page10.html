<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ANVI SYSTEM DIAGNOSTICS // ANVI SESSION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="chrome">
    <button class="chrome-logo" id="logoBtn" type="button" aria-label="ANVI system logo">
      <span class="logo-mark">A</span><span class="logo-text">ANVI // NEW SESSION</span>
    </button>
    <div class="chrome-status">
      <button class="session-tag" id="sessionBtn" type="button">SESSION 0047</button>
      <span class="status-dot"><i></i> SYSTEM ONLINE</span>
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">🔈 SOUND: OFF</button>
    </div>
  </header>

  <button class="back-btn" id="backBtn" type="button">‹ back</button>
  <div class="grain" aria-hidden="true"></div>
  <div class="fx-overlay" id="fxOverlay" aria-hidden="true"></div>

  <main class="app">
    <div class="page" aria-live="polite">
      <div class="card">
        <p class="kicker">RUNNING PROCESSES</p>
        <h1 class="title">ANVI SYSTEM DIAGNOSTICS</h1>

        <div class="stats">
          <div class="stat-row">
            <span class="stat-label">ANVI.EXE</span>
            <span class="stat-bar"><span style="--fill:100%"></span></span>
            <span class="stat-val">RUNNING</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">CHAOS.EXE</span>
            <span class="stat-bar"><span style="--fill:100%"></span></span>
            <span class="stat-val">RUNNING</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">COMMON SENSE.EXE</span>
            <span class="stat-bar"><span style="--fill:32%"></span></span>
            <span class="stat-val warn">32%</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">RANDOMNESS.EXE</span>
            <span class="stat-bar"><span style="--fill:100%"></span></span>
            <span class="stat-val">OVERCLOCKED</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">ABILITY TO EXPLAIN</span>
            <span class="stat-bar"><span style="--fill:4%"></span></span>
            <span class="stat-val err">LOST</span>
          </div>
        </div>

        <p class="body-text" style="margin-top:-14px;"><strong>Would you like to continue?</strong></p>

        <div class="buttons">
          <a class="choice primary" href="page11.html">Obviously</a>
          <a class="choice" href="page13.html">I want chaos</a>
        </div>

        <p class="footnote">NODE 10 / 14 · google has declined to comment.</p>
      </div>
    </div>
  </main>

  <div class="page-index">PAGE 10 / 14</div>
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
